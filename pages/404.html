<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found · DashKit Pro</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dark.css">
  <link rel="stylesheet" href="../css/light.css">
  <script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('dashkit_theme')||'dark')})();</script>
  <style>
    .floating { animation: float 4s ease-in-out infinite; }
    @keyframes float {
      0%,100% { transform: translateY(0); }
      50%      { transform: translateY(-16px); }
    }
    .orbit { animation: orbit 8s linear infinite; transform-origin: center; }
    @keyframes orbit {
      from { transform: rotate(0deg) translateX(120px) rotate(0deg); }
      to   { transform: rotate(360deg) translateX(120px) rotate(-360deg); }
    }
    .orbit2 { animation: orbit2 12s linear infinite; transform-origin: center; }
    @keyframes orbit2 {
      from { transform: rotate(180deg) translateX(170px) rotate(-180deg); }
      to   { transform: rotate(540deg) translateX(170px) rotate(-540deg); }
    }
  </style>
</head>
<body>
  <div class="error-page">

    <!-- Illustration -->
    <div style="position:relative;width:260px;height:260px;margin:0 auto 16px;" class="floating">
      <!-- Planet -->
      <svg viewBox="0 0 260 260" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;">
        <defs>
          <radialGradient id="planetGrad" cx="40%" cy="35%">
            <stop offset="0%" stop-color="#6366f1"/>
            <stop offset="100%" stop-color="#1a1d27"/>
          </radialGradient>
          <radialGradient id="glowGrad" cx="50%" cy="50%">
            <stop offset="0%" stop-color="rgba(99,102,241,.25)"/>
            <stop offset="100%" stop-color="transparent"/>
          </radialGradient>
        </defs>
        <!-- Glow -->
        <ellipse cx="130" cy="130" rx="110" ry="110" fill="url(#glowGrad)"/>
        <!-- Ring -->
        <ellipse cx="130" cy="148" rx="106" ry="22" stroke="#6366f1" stroke-width="3" fill="none" stroke-dasharray="6 4" opacity=".5"/>
        <!-- Planet body -->
        <circle cx="130" cy="130" r="72" fill="url(#planetGrad)"/>
        <!-- Craters -->
        <circle cx="110" cy="118" r="12" fill="rgba(0,0,0,.25)"/>
        <circle cx="148" cy="138" r="8" fill="rgba(0,0,0,.2)"/>
        <circle cx="125" cy="150" r="5" fill="rgba(0,0,0,.15)"/>
        <!-- Highlight -->
        <circle cx="108" cy="110" r="18" fill="rgba(255,255,255,.07)"/>
      </svg>

      <!-- Orbiting satellite -->
      <div class="orbit" style="position:absolute;top:50%;left:50%;margin:-8px 0 0 -8px;">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <rect x="6" y="4" width="4" height="8" rx="1" fill="#38bdf8"/>
          <rect x="1" y="6" width="5" height="4" rx="1" fill="#6366f1"/>
          <rect x="10" y="6" width="5" height="4" rx="1" fill="#6366f1"/>
        </svg>
      </div>

      <!-- Orbiting star -->
      <div class="orbit2" style="position:absolute;top:50%;left:50%;margin:-5px 0 0 -5px;">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <polygon points="5,0 6,4 10,4 7,6.5 8,10 5,7.5 2,10 3,6.5 0,4 4,4" fill="#f59e0b"/>
        </svg>
      </div>
    </div>

    <!-- 404 number -->
    <div class="error-code">404</div>

    <h1 class="error-title">Lost in space</h1>
    <p class="error-desc">
      The page you're looking for has drifted into a black hole.
      Let's get you back to mission control.
    </p>

    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;">
      <a href="dashboard.html" class="btn btn-primary" style="padding:12px 28px;">
        <i data-lucide="layout-dashboard"></i>
        Back to Dashboard
      </a>
      <button class="btn btn-ghost" onclick="history.back()" style="padding:12px 28px;">
        <i data-lucide="arrow-left"></i>
        Go Back
      </button>
    </div>

    <!-- Quick links -->
    <div style="margin-top:48px;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;">
      <a href="dashboard.html" style="color:var(--text-muted);font-size:14px;display:flex;align-items:center;gap:6px;">
        <i data-lucide="home" style="width:14px;height:14px;"></i> Home
      </a>
      <a href="analytics.html" style="color:var(--text-muted);font-size:14px;display:flex;align-items:center;gap:6px;">
        <i data-lucide="bar-chart-2" style="width:14px;height:14px;"></i> Analytics
      </a>
      <a href="users.html" style="color:var(--text-muted);font-size:14px;display:flex;align-items:center;gap:6px;">
        <i data-lucide="users" style="width:14px;height:14px;"></i> Users
      </a>
      <a href="settings.html" style="color:var(--text-muted);font-size:14px;display:flex;align-items:center;gap:6px;">
        <i data-lucide="settings" style="width:14px;height:14px;"></i> Settings
      </a>
    </div>

    <!-- Theme toggle -->
    <div style="margin-top:32px;">
      <button id="themeToggle" class="icon-btn" title="Toggle theme">
        <i data-lucide="sun"></i>
      </button>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../js/app.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
